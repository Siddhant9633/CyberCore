<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERCORE Security Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 380px;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .status-pill {
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
      text-transform: uppercase;
    }
    .site-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .site-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 10px;
    }
    .score-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b50;
      margin-bottom: 12px;
    }
    .score-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .score-number {
      font-size: 24px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .risk-safe {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }
    .risk-warn {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
    }
    .risk-danger {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
    }
    .checks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .check-item {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
    }
    .check-title {
      color: #64748b;
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .check-val {
      font-weight: 600;
      color: #e2e8f0;
    }
    .manual-box {
      margin-bottom: 12px;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      color: #f8fafc;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #06b6d4;
    }
    button.btn-primary {
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .actions-row {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: block;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }
    .loading-spinner {
      text-align: center;
      padding: 24px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <span>CYBERCORE</span>
    </div>
    <div class="status-pill" id="shield-status">SHIELD ACTIVE</div>
  </div>

  <div id="content-area">
    <div class="loading-spinner">Analyzing active tab...</div>
  </div>

  <div class="manual-box">
    <div class="input-row">
      <input type="text" id="manual-url" placeholder="Scan any URL manually..." />
      <button class="btn-primary" id="btn-manual-scan">Scan</button>
    </div>
  </div>

  <div class="actions-row">
    <a href="http://localhost:3000/scanner" target="_blank" class="btn-secondary" id="btn-full-audit">
      Web Dashboard ↗
    </a>
    <button class="btn-secondary btn-danger" id="btn-report-threat">
      Report URL
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
